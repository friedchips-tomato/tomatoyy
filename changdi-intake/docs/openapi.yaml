openapi: 3.0.3
info:
  title: 长堤风貌街接诉即办合作方接单接口
  version: 1.2.0
  description: |
    合作方通过服务端提交游客和居民的申报及照片，并向原提交人展示回执。
    POST /api/v1/integrations/intake/cases 是唯一合作方接口。办件查询、补材料、评价和补办由小程序办理。
    POST /api/v1/public/cases 是小程序游客诉求页使用的第一方公开接口，不要求接入凭据，
    去重键由小程序生成。两者的请求和响应契约各自独立。
    本文的地址、工单信息和回执值均为测试占位数据。正式接入基址和凭据由项目方另行交付。
servers:
  - url: https://intake-api.example-integration.test
    description: HTTPS 联调基址示例（保留测试域名）
  - url: http://127.0.0.1:3400
    description: 本地开发，仅使用本地测试配置
paths:
  /api/v1/integrations/intake/cases:
    post:
      operationId: submitIntakeCase
      summary: 提交申报及照片，或重取同一申报的回执
      description: |
        使用完整路径，省略查询参数和末尾斜杠。对该路径使用其他方法时返回
        405、Allow 响应头（值为 POST）及 {"error":"method_not_allowed"}。

        去重键为接入凭据对应的接入方身份与 externalCaseId。比较时对文本去首尾空白，
        将 occurredAt 转为 UTC，按文件声明类型与实际内容摘要比较照片。照片顺序及文件名
        不影响比较，重复照片仍参与数量和内容比较。可选字段省略时不计入内容。

        首次保存工单及全部照片后返回 201；同一去重键及相同规范化内容返回 200 和原回执；
        同一去重键及不同的合法内容返回 409，原单保持不变。不同接入方可以独立使用同一外部单号。
        默认只返回三个必返标识。项目方启用微信小程序码时，201 和 200 均含 wechatCode，
        同一工单在同一小程序账号及版本环境下复用已生成的图片。
        超时、连接中断或服务端暂时失败后，使用原外部单号和相同内容重试；
        收到 503 时遵循 Retry-After。发生冲突时核对原单，避免更换单号重复提交同一事项。
        wechat_code_unavailable 表示工单与附件已保存，小程序码暂不可用。原样重试成功时返回 200，
        以相同三个标识继续交付回执。

        平台收到 201 或 200 后才展示提交成功。privateLookupToken 仅在原提交人的
        成功会话中私下展示并提醒妥善保存。禁止写入 URL、二维码、日志、埋点、运营对账或平台长期后台记录。
        对账可使用合作方单号和工单编号。接入 Bearer 凭据由合作方服务端保管，不进入客户端。
      security:
        - IntegrationBearer: []
      requestBody:
        required: true
        description: |
          一个 multipart 请求。整个请求体上限为 15,794,176 字节
          （3 × 5 MiB + 64 KiB，含所有分隔线和各 part 头部）。
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload:
                  type: string
                  description: |
                    恰好一个名为 payload 的普通文本 part，内容为序列化的 UTF-8 JSON 对象。
                    不带 filename。解码后的文本按 UTF-8 计最多 32,768 字节。
                    工具先按本层 schema 处理文本 part，再解析 JSON 并按 x-json-schema 引用的字段定义校验。
                  x-json-schema:
                    $ref: '#/components/schemas/IntakePayload'
                  example: '{"externalCaseId":"EXT-SAMPLE-000137","occurredAt":"2026-11-17T09:42:00+08:00","location":"测试点位 A","category":"ROAD_SURFACE","description":"测试样例：人行道砖块松动。"}'
                photos:
                  type: array
                  minItems: 0
                  maxItems: 3
                  description: |
                    可省略。每张照片使用一个独立文件 part（携带 filename），字段名均为 photos。
                    单张上限 5,242,880 字节（5 MiB），照片合计最多 15,728,640 字节（15 MiB）。
                    各 part 声明 image/jpeg、image/png 或 image/webp，字节内容须通过对应的文件签名校验。
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: text/plain; charset=UTF-8
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 首次提交，工单及照片已保存。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: 同一接入方和外部单号以相同内容重试，返回原工单的同一回执。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: |
            请求体不完整且仍能返回应用响应（incomplete_body）；multipart 无法解析（invalid_multipart）；
            payload 缺失、重复或有未知 part 名（invalid_multipart_fields）；
            payload 是文件 part 或文本超限（invalid_payload_part）；
            JSON 语法错误（invalid_json）或顶层不是对象（invalid_json_object）；
            对象含未知字段（unknown_field）；字段缺失（包括 occurredAt）、类型、长度或文本内容无效（invalid_field）；
            非空且通过通用文本校验的 occurredAt 不符合日期时间规则（invalid_timestamp）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum:
                          - incomplete_body
                          - invalid_multipart
                          - invalid_multipart_fields
                          - invalid_payload_part
                          - invalid_json
                          - invalid_json_object
                          - unknown_field
                          - invalid_field
                          - invalid_timestamp
        '401':
          description: Authorization 缺失、格式错误或 Bearer 凭据未知（包括撤换后已失效的凭据）。
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [unauthorized]
        '403':
          description: Bearer 凭据有效，但属于工作人员身份。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [forbidden]
        '408':
          description: |
            应用等待请求体超过约 15 秒（body_timeout）。若连接已中断或由 HTTP 层先超时，可能收不到 JSON。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [body_timeout]
        '409':
          description: 同一接入方复用外部单号提交不同内容，原单和原附件保持不变。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [submission_conflict]
              example:
                error: submission_conflict
        '413':
          description: 照片张数超限（too_many_photos）、单张超限（photo_too_large）或请求体总长度超限（body_too_large）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_photos, photo_too_large, body_too_large]
        '415':
          description: |
            请求 Content-Type 未声明 multipart/form-data 及参数分隔符（expected_multipart）；
            photos part 缺少文件形式、类型不在允许列表或内容签名与声明类型不匹配（invalid_photo_type）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [expected_multipart, invalid_photo_type]
        '500':
          description: 应用内部错误。可按原单号和相同内容重试。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [internal_error]
        '503':
          description: |
            服务当前已有 4 个上传请求在途（intake_busy），或数据库繁忙／锁定（database_busy）。
            已启用的小程序码暂不可用或生成队列已满（wechat_code_unavailable）时，
            工单和申报附件已保存，仍可用同一外部单号及相同内容重试。
          headers:
            Retry-After:
              description: 等待秒数。
              schema:
                type: integer
                enum: [1]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [intake_busy, database_busy, wechat_code_unavailable]
  /api/v1/public/cases:
    post:
      operationId: submitPublicCase
      summary: 游客公开申报，或重取同一申报的回执
      description: |
        小程序游客诉求页直接调用，不要求 Authorization。请求携带 Authorization 时按匿名申报处理，
        不校验接入凭据。对该路径使用其他方法时返回 405、Allow 响应头（值为 POST）
        及 {"error":"method_not_allowed"}。

        去重键固定为 clientRequestId，由小程序生成并在重试时复用。比较时对文本去首尾空白，
        将 occurredAt 转为 UTC，按文件声明类型与实际内容摘要比较照片。照片顺序及文件名
        不影响比较，重复照片仍参与数量和内容比较。可选字段省略时不计入内容。

        首次保存工单及全部照片后返回 201；同一 clientRequestId 及相同规范化内容返回 200 和原回执；
        同一 clientRequestId 及不同的合法内容返回 409，原单保持不变。项目方启用微信小程序码时，
        201 和 200 均含 wechatCode，同一工单在同一小程序账号及版本环境下复用已生成的图片。

        按对端地址做窗口限流，默认每 600 秒只统计 10 次新建建单。只有新建建单受上限约束：
        已成功单号的重放（内容一致返回 200，内容不同返回 409）不消耗额度，也不受当前窗口上限影响，
        原提交人始终能取回自己的回执。超限的新建请求返回 429 too_many_requests 并带 Retry-After（秒），
        被限流的请求不落库。
        超时、连接中断或服务端暂时失败后，使用原 clientRequestId 和相同内容重试。

        平台收到 201 或 200 后才展示提交成功。privateLookupToken 仅在原提交人的
        成功会话中私下展示并提醒妥善保存。禁止写入 URL、二维码、日志、埋点、运营对账或平台长期后台记录。
      security: []
      requestBody:
        required: true
        description: |
          一个 multipart 请求。整个请求体上限为 15,794,176 字节
          （3 × 5 MiB + 64 KiB，含所有分隔线和各 part 头部）。
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload:
                  type: string
                  description: |
                    恰好一个名为 payload 的普通文本 part，内容为序列化的 UTF-8 JSON 对象。
                    不带 filename。解码后的文本按 UTF-8 计最多 32,768 字节。
                    工具先按本层 schema 处理文本 part，再解析 JSON 并按 x-json-schema 引用的字段定义校验。
                  x-json-schema:
                    $ref: '#/components/schemas/PublicSubmissionPayload'
                  example: '{"clientRequestId":"mp-20261119-000137","occurredAt":"2026-11-17T09:42:00+08:00","location":"测试点位 A","category":"ROAD_SURFACE","description":"测试样例：人行道砖块松动。"}'
                photos:
                  type: array
                  minItems: 0
                  maxItems: 3
                  description: |
                    可省略。每张照片使用一个独立文件 part（携带 filename），字段名均为 photos。
                    单张上限 5,242,880 字节（5 MiB），照片合计最多 15,728,640 字节（15 MiB）。
                    各 part 声明 image/jpeg、image/png 或 image/webp，字节内容须通过对应的文件签名校验。
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: text/plain; charset=UTF-8
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 首次申报，工单及照片已保存。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: 同一 clientRequestId 以相同内容重试，返回原工单的同一回执。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: |
            请求体不完整且仍能返回应用响应（incomplete_body）；multipart 无法解析（invalid_multipart）；
            payload 缺失、重复或有未知 part 名（invalid_multipart_fields）；
            payload 是文件 part 或文本超限（invalid_payload_part）；
            JSON 语法错误（invalid_json）或顶层不是对象（invalid_json_object）；
            对象含未知字段（unknown_field）；字段缺失（包括 clientRequestId 和 occurredAt）、
            类型、长度或文本内容无效（invalid_field）；
            非空且通过通用文本校验的 occurredAt 不符合日期时间规则（invalid_timestamp）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum:
                          - incomplete_body
                          - invalid_multipart
                          - invalid_multipart_fields
                          - invalid_payload_part
                          - invalid_json
                          - invalid_json_object
                          - unknown_field
                          - invalid_field
                          - invalid_timestamp
        '409':
          description: 同一 clientRequestId 提交不同内容，原单和原附件保持不变。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [submission_conflict]
              example:
                error: submission_conflict
        '413':
          description: 照片张数超限（too_many_photos）、单张超限（photo_too_large）或请求体总长度超限（body_too_large）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_photos, photo_too_large, body_too_large]
        '415':
          description: |
            请求 Content-Type 未声明 multipart/form-data 及参数分隔符（expected_multipart）；
            photos part 缺少文件形式、类型不在允许列表或内容签名与声明类型不匹配（invalid_photo_type）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [expected_multipart, invalid_photo_type]
        '429':
          description: 同一对端地址在限流窗口内的新建建单次数超限，本次请求未落库。
          headers:
            Retry-After:
              description: 距离当前限流窗口结束还需等待的秒数。
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_requests]
        '500':
          description: 应用内部错误。可按原 clientRequestId 和相同内容重试。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [internal_error]
        '503':
          description: |
            服务当前已有 4 个上传请求在途（intake_busy），或数据库繁忙／锁定（database_busy）。
            已启用的小程序码暂不可用或生成队列已满（wechat_code_unavailable）时，
            工单和申报附件已保存，仍可用同一 clientRequestId 及相同内容重试。
          headers:
            Retry-After:
              description: 等待秒数。
              schema:
                type: integer
                enum: [1]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [intake_busy, database_busy, wechat_code_unavailable]
  /api/v1/public/parking/lots:
    get:
      operationId: listParkingLots
      summary: 读取车场目录及静态信息
      description: |
        匿名只读接口，不要求 Authorization，也不校验请求携带的凭据。
        按对端地址做窗口限流，默认每 600 秒 60 次，超限返回 429 too_many_requests 并带
        Retry-After（秒）。响应统一使用 Cache-Control: no-store，不缓存。

        数据为合成示范数据（source 固定为 synthetic），不是真实车场余位，页面必须标注「模拟」。
        运行时数据不可用时仍返回 200 和静态车场信息，available 为 false、degraded 为 true，
        并在 note 中写明原因；本接口不返回 5xx。
      security: []
      responses:
        '200':
          description: 车场目录。运行时不可用时 available 为 false，items 仍含静态车场信息。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreParking'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingLotsResponse'
        '429':
          description: 同一对端地址在限流窗口内的请求次数超限。
          headers:
            Retry-After:
              description: 距离当前限流窗口结束还需等待的秒数。
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_requests]
  /api/v1/public/parking/recommendations:
    get:
      operationId: getParkingRecommendations
      summary: 按目的地与到达时间推荐停车场
      description: |
        匿名只读接口，不要求 Authorization，限流与 Cache-Control: no-store 规则同车场目录。
        未列出的查询参数或同名重复参数返回 400 invalid_filter。

        arrive_at 须为带时区的 ISO8601 时间。预测不可用时 arrive_free 为 null，不得按 0 处理。
        车场运行时数据不可用时仍返回 200，available 为 false、degraded 为 true，
        静态车场信息照常给出，降级信息原样透传；本接口不返回 5xx。
      security: []
      parameters:
        - name: destination_id
          in: query
          required: true
          description: 导览点位代码。
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
        - name: arrive_at
          in: query
          required: true
          description: 到达时间，带时区的 ISO8601 日期时间。
          schema:
            type: string
            format: date-time
            example: '2026-11-22T10:30:00.000Z'
        - name: preference
          in: query
          required: false
          description: 推荐偏好，默认 save_time（省时）；less_walking 为少走路。
          schema:
            type: string
            enum: [save_time, less_walking]
            default: save_time
        - name: vehicle_height_m
          in: query
          required: false
          description: 车辆高度（米），须为正数。
          schema:
            type: number
            exclusiveMinimum: true
            minimum: 0
        - name: stay_hours
          in: query
          required: false
          description: 预计停留时长（小时），须为正数。
          schema:
            type: number
            exclusiveMinimum: true
            minimum: 0
      responses:
        '200':
          description: 推荐结果。目的地无可用预测时 items 可为空，excluded 说明排除原因。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreParking'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingRecommendationsResponse'
        '400':
          description: |
            destination_id 缺失或不匹配 ^[A-Za-z0-9_-]{1,64}$、preference 不在枚举内、
            vehicle_height_m 或 stay_hours 不是正数（invalid_field）；
            arrive_at 缺失或不是带时区的 ISO8601 日期时间（invalid_timestamp）；
            出现未列出的参数或同名重复参数（invalid_filter）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [invalid_field, invalid_timestamp, invalid_filter]
        '429':
          description: 同一对端地址在限流窗口内的请求次数超限。
          headers:
            Retry-After:
              description: 距离当前限流窗口结束还需等待的秒数。
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_requests]
  /api/v1/public/parking/lots/{lot_id}/forecast:
    get:
      operationId: getParkingLotForecast
      summary: 读取单个车场未来 15–60 分钟的余位预测
      description: |
        匿名只读接口，不要求 Authorization，限流与 Cache-Control: no-store 规则同车场目录。
        未登记的 lot_id 返回 404 lot_not_found。

        issued_at 默认取服务器当前时间。horizons 为逗号分隔的分钟数，取值限于 15、30、45、60，
        省略时返回全部。method 说明预测来源：model 为模型输出，last_known 沿用最近观测，
        same_slot_baseline 与 same_weekday_baseline 为同槽位或同星期基线，
        unavailable 表示该时段不可预测。degraded 与 degrade_reason 原样透传，本接口不返回 5xx。
      security: []
      parameters:
        - name: lot_id
          in: path
          required: true
          description: 车场目录代码，例如 P1。
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,32}$'
        - name: issued_at
          in: query
          required: false
          description: 签发时间，默认服务器当前时间；须为带时区的 ISO8601 日期时间。
          schema:
            type: string
            format: date-time
        - name: horizons
          in: query
          required: false
          description: 逗号分隔的预测时长（分钟），取值限于 15、30、45、60，省略时返回全部。
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              enum: [15, 30, 45, 60]
      responses:
        '200':
          description: 车场预测。数据不可用时 available 为 false，forecasts 中的 method 为 unavailable。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreParking'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingForecastResponse'
        '400':
          description: |
            horizons 含不允许的取值或为空（invalid_field）；issued_at 不是带时区的 ISO8601
            日期时间（invalid_timestamp）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [invalid_field, invalid_timestamp]
        '404':
          description: lot_id 未在车场目录中登记。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [lot_not_found]
              example:
                error: lot_not_found
        '429':
          description: 同一对端地址在限流窗口内的请求次数超限。
          headers:
            Retry-After:
              description: 距离当前限流窗口结束还需等待的秒数。
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_requests]
components:
  securitySchemes:
    IntegrationBearer:
      type: http
      scheme: bearer
      description: |
        Authorization 头使用 Bearer <ACCESS_TOKEN>。接入令牌为 32–256 位，
        字符限 A–Z、a–z、0–9、下划线和连字符。由项目方签发、轮换或撤换。
  headers:
    NoStore:
      description: 回执含私密凭证，请勿缓存。
      schema:
        type: string
        enum: [no-store]
    NoStoreParking:
      description: 停车数据随时变化，请勿缓存。
      schema:
        type: string
        enum: [no-store]
  schemas:
    IntakePayload:
      type: object
      additionalProperties: false
      required: [externalCaseId, occurredAt, location, category, description]
      description: |
        本 schema 校验从 payload 文本 part 解析出的 JSON 对象。
        所有字段均须为有效 Unicode 字符串，不允许 NUL。服务端在裁剪空白前按
        Unicode 码点计算长度上限，并拒绝裁剪后为空的字符串。
        可选字段可省略；出现时也必须满足相同文本规则。
      properties:
        externalCaseId:
          type: string
          minLength: 1
          maxLength: 128
          description: 合作方的稳定申报单号，由合作方生成。
        occurredAt:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\s*[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\s*$'
          description: |
            发生时间，使用 YYYY-MM-DDTHH:mm:ss、可选 1–3 位秒小数，并带 Z 或 ±HH:MM。
            服务端校验实际日期及时刻，归一化为 UTC，UTC 年须在 0001–9999。
          example: '2026-11-17T09:42:00+08:00'
        location:
          type: string
          minLength: 1
          maxLength: 300
          description: 发生地点，支持手填文本。
        category:
          type: string
          minLength: 1
          maxLength: 80
          description: 问题类别。当前接受自由文本，分类枚举待联调确认。
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: 申报描述。
        suggestedDepartment:
          type: string
          minLength: 1
          maxLength: 100
          description: 可选的建议承办部门。
        contact:
          type: string
          minLength: 1
          maxLength: 300
          description: 可选的联系方式文本。匿名申报可省略。
          example: synthetic-contact-0001
    PublicSubmissionPayload:
      type: object
      additionalProperties: false
      required: [clientRequestId, occurredAt, location, category, description]
      description: |
        本 schema 校验从 payload 文本 part 解析出的 JSON 对象。
        所有字段均须为有效 Unicode 字符串，不允许 NUL。服务端在裁剪空白前按
        Unicode 码点计算长度上限，并拒绝裁剪后为空的字符串。
        可选字段可省略；出现时也必须满足相同文本规则，没有值时省略而不是传空字符串。
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            小程序生成的去重键。同一 app 会话内不同申报使用不同取值，重试时复用原值。
        occurredAt:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\s*[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\s*$'
          description: |
            发生时间，使用 YYYY-MM-DDTHH:mm:ss、可选 1–3 位秒小数，并带 Z 或 ±HH:MM。
            服务端校验实际日期及时刻，归一化为 UTC，UTC 年须在 0001–9999。
          example: '2026-11-17T09:42:00+08:00'
        location:
          type: string
          minLength: 1
          maxLength: 300
          description: 发生地点，支持手填文本。
        category:
          type: string
          minLength: 1
          maxLength: 80
          description: 问题类别。当前接受自由文本，分类枚举待联调确认。
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: 申报描述。
        suggestedDepartment:
          type: string
          minLength: 1
          maxLength: 100
          description: 可选的建议承办部门。
        contact:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            可选的联系方式文本，单独存储且不进入公开查询。匿名申报可省略。
          example: synthetic-contact-0001
    Receipt:
      type: object
      additionalProperties: false
      required: [caseNumber, publicLookupCode, privateLookupToken]
      properties:
        caseNumber:
          type: string
          pattern: '^CD-[0-9A-F]{32}$'
          description: 项目方生成的工单编号。
        publicLookupCode:
          type: string
          pattern: '^[A-Za-z0-9_-]{24}$'
          description: |
            公开查询码用于定位工单，也是启用微信小程序码时的场景值。
            公开页仅展示编号、状态和允许公开的时间节点。
        privateLookupToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            仅交原提交人的私密查询凭证，与公开查询码分开。禁止写入二维码、URL、日志或运营对账记录。
        wechatCode:
          $ref: '#/components/schemas/WechatCode'
      example:
        caseNumber: CD-00000000000040008000000000000001
        publicLookupCode: test_lookup_placeholder0
        privateLookupToken: test_private_lookup_placeholder_0000000000A
    WechatCode:
      type: object
      additionalProperties: false
      required: [envVersion, mediaType, base64]
      description: |
        仅在项目方启用微信小程序码时提供。扫码进入 pages/public/index，
        场景值只有 publicLookupCode。可按 mediaType 还原并在成功回执会话中展示。
      properties:
        envVersion:
          type: string
          enum: [release, trial, develop]
          description: 小程序正式版、体验版或开发版。
        mediaType:
          type: string
          enum: [image/jpeg, image/png]
        base64:
          type: string
          format: byte
          minLength: 4
          maxLength: 1398104
          description: 标准 Base64 图片字节，没有 data URL 前缀。解码后最多 1 MiB。
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z]+(_[a-z]+)*$'
          description: 应用返回的机器可读错误码。
    ParkingFee:
      type: object
      additionalProperties: false
      required: [mode, amount, unit, note]
      description: 计费信息。对象本身一定存在，amount 与 unit 的值可能为 null。
      properties:
        mode:
          type: string
          enum: [hourly, flat, unknown]
          description: 计费方式。unknown 表示计费方式未知。
          example: hourly
        amount:
          type: number
          nullable: true
          description: 计费金额，未知时为 null。
          example: 5
        unit:
          type: string
          nullable: true
          enum: [CNY]
          description: 币种，未知时为 null。
          example: CNY
        note:
          type: string
          description: 面向游客的计费说明。
          example: 5 元/小时（示范）
    ParkingAccess:
      type: object
      additionalProperties: false
      required: [open_hours, one_way, restricted_hours, height_limit_m, note]
      description: 通行限制信息。对象本身一定存在，部分字段的值可能为 null。
      properties:
        open_hours:
          type: string
          nullable: true
          description: 开放时段，未知时为 null。
          example: 00:00-24:00
        one_way:
          type: boolean
          description: 是否单行进出。
        restricted_hours:
          type: array
          nullable: true
          description: 受限时段列表，无相关数据时为 null。
          items:
            type: object
            additionalProperties: false
            required: [from, to, note]
            properties:
              from:
                type: string
                description: 受限开始时刻。
              to:
                type: string
                description: 受限结束时刻。
              note:
                type: string
                description: 受限说明。
        height_limit_m:
          type: number
          nullable: true
          description: 限高（米），无限制或未知时为 null。
        note:
          type: string
          description: 通行限制说明。
    ParkingWalk:
      type: object
      additionalProperties: false
      required: [meters, minutes]
      description: 车场到街区的步行距离。
      properties:
        meters:
          type: integer
          minimum: 0
          description: 步行距离（米），不小于 0。
          example: 150
        minutes:
          type: integer
          minimum: 0
          description: 步行时间（分钟），不小于 0。
          example: 2
    ParkingLot:
      type: object
      additionalProperties: false
      required: [lot_id, name, total_spaces, fee, access, walk_to_street, district, notes, source]
      description: 单个车场的静态信息。
      properties:
        lot_id:
          type: string
          description: 车场目录代码，例如 P1。
          example: P1
        name:
          type: string
          description: 车场名称。
          example: 沿江停车场
        total_spaces:
          type: integer
          minimum: 1
          description: 车位总数，不小于 1。
          example: 120
        fee:
          $ref: '#/components/schemas/ParkingFee'
        access:
          $ref: '#/components/schemas/ParkingAccess'
        walk_to_street:
          $ref: '#/components/schemas/ParkingWalk'
        district:
          type: string
          nullable: true
          description: 所属街区或片区，未知时为 null。
          example: 长堤骑楼街
        notes:
          type: string
          nullable: true
          description: 补充说明，合成数据会注明用途；无说明时为 null。
          example: 合成数据，仅用于管线验证
        source:
          type: string
          enum: [synthetic, manual, api, camera]
          description: 车场静态数据来源。
    ParkingLotsResponse:
      type: object
      additionalProperties: false
      required: [source, available, degraded, note, generated_at, items]
      description: 车场目录响应。
      properties:
        source:
          type: string
          enum: [synthetic]
          description: 数据来源，固定为合成示范数据。
        available:
          type: boolean
          description: 运行时数据是否可用。false 时 items 仍为静态车场信息。
        degraded:
          type: boolean
          description: 是否处于降级状态。
        note:
          type: string
          nullable: true
          description: 降级或不可用的原因，正常时为 null。
        generated_at:
          type: string
          format: date-time
          description: 本次响应的生成时间（UTC）。
        items:
          type: array
          description: 车场列表。
          items:
            $ref: '#/components/schemas/ParkingLot'
    ParkingRecommendationItem:
      type: object
      additionalProperties: false
      required:
        - lot_id
        - name
        - arrive_free
        - arrive_free_rate
        - arrive_free_p10
        - arrive_free_p90
        - walk_meters
        - walk_minutes
        - fee_amount
        - fee_unit
        - updated_at
        - stale
        - score
        - score_breakdown
        - reasons
        - total_time_minutes
        - transfer
        - restrictions
        - forecast_method
        - degraded
      description: 一条停车推荐、备选或偏移项，字段名使用 snake_case。
      properties:
        lot_id:
          type: string
          description: 车场目录代码。
          example: P1
        name:
          type: string
          description: 车场名称。
        arrive_free:
          type: number
          nullable: true
          description: 到达时的预计空闲车位。null 表示不可用，不是 0。
        arrive_free_rate:
          type: number
          nullable: true
          description: 到达时空闲车位占比（0–1），不可用时为 null。
        arrive_free_p10:
          type: number
          nullable: true
          description: 空闲车位预测下限（P10），不可用时为 null。
        arrive_free_p90:
          type: number
          nullable: true
          description: 空闲车位预测上限（P90），不可用时为 null。
        walk_meters:
          type: integer
          description: 车场到目的地的步行距离（米）。
        walk_minutes:
          type: number
          description: 步行时间（分钟）。
        fee_amount:
          type: number
          nullable: true
          description: 预计停车费用金额，费用未知时为 null。
        fee_unit:
          type: string
          nullable: true
          description: 费用单位或币种，例如 CNY；fee_amount 为 null 时也为 null。
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 该条数据或预测的更新时间（UTC），无更新时间时为 null。
        stale:
          type: boolean
          description: 数据是否已过时。
        score:
          type: number
          description: 综合评分，越高越优先。
        score_breakdown:
          type: array
          description: |
            评分构成明细，固定七项且顺序固定：
            arrive_free、arrive_free_rate、walk_cost、total_time、fee_cost、confidence、restriction_penalty。
            每项给出权重、原始值、归一值和对总分的贡献。
          items:
            type: object
            additionalProperties: false
            required: [factor, weight, raw, normalized, contribution]
            properties:
              factor:
                type: string
                enum: [arrive_free, arrive_free_rate, walk_cost, total_time, fee_cost, confidence, restriction_penalty]
                description: 评分因子。
              weight:
                type: number
                description: 该因子的权重。
              raw:
                type: number
                nullable: true
                description: |
                  原始值。arrive_free 或 arrive_free_rate 预测不可用时为 null，
                  fee_cost 费用未知时也为 null。
              normalized:
                type: number
                description: 归一化后的取值。
              contribution:
                type: number
                description: 对总分的贡献。
        reasons:
          type: array
          description: 推荐理由列表。
          items:
            type: string
        total_time_minutes:
          type: number
          description: 含停车与步行的总耗时（分钟）。
        transfer:
          type: object
          additionalProperties: false
          required: [mode, feasible, minutes, note]
          description: |
            换乘或接驳信息。对象本身始终存在；当前实现恒为 mode=null、feasible=false、
            minutes=null、note="暂无可用接驳点数据"，没有接驳点数据时不编造。
          properties:
            mode:
              type: string
              nullable: true
              description: 接驳方式，无数据时为 null。
            feasible:
              type: boolean
              description: 当前是否可换乘接驳；当前实现恒为 false。
            minutes:
              type: number
              nullable: true
              description: 接驳耗时（分钟），无数据时为 null。
            note:
              type: string
              description: 接驳说明。
        restrictions:
          type: array
          description: 限制条件说明，例如限高、限时，无限制时为空数组。
          items:
            type: string
        forecast_method:
          type: string
          enum: [model, last_known, same_slot_baseline, same_weekday_baseline, unavailable]
          description: 该条预测的来源方法。
        degraded:
          type: boolean
          description: 该条结果是否来自降级路径。
    ParkingExcludedLot:
      type: object
      additionalProperties: false
      required: [lot_id, name, reason]
      description: 被排除的停车场及原因。
      properties:
        lot_id:
          type: string
          description: 车场目录代码。
          example: P2
        name:
          type: string
          description: 车场名称。
          example: 内街停车场
        reason:
          type: string
          description: 排除原因，例如限高不符或已满。
    ParkingRecommendationsResponse:
      type: object
      additionalProperties: false
      required:
        - destination_id
        - arrive_at
        - preference
        - generated_at
        - source
        - available
        - degraded
        - note
        - items
        - alternates
        - excluded
        - offsets
      description: 停车推荐响应。
      properties:
        destination_id:
          type: string
          description: 请求中的导览点位代码。
          example: CD-0001
        arrive_at:
          type: string
          format: date-time
          description: 请求中的到达时间，回显为 UTC。
          example: '2026-11-22T10:30:00.000Z'
        preference:
          type: string
          enum: [save_time, less_walking]
          description: 实际采用的推荐偏好。
        generated_at:
          type: string
          format: date-time
          description: 本次响应的生成时间（UTC）。
        source:
          type: string
          enum: [synthetic]
          description: 数据来源，固定为合成示范数据。
        available:
          type: boolean
          description: 运行时数据是否可用。false 时静态车场信息仍照常给出。
        degraded:
          type: boolean
          description: 是否处于降级状态。
        note:
          type: string
          nullable: true
          description: 降级或不可用的原因，正常时为 null。
        items:
          type: array
          description: 首选推荐列表。
          items:
            $ref: '#/components/schemas/ParkingRecommendationItem'
        alternates:
          type: array
          description: 备选推荐列表，字段同 items。
          items:
            $ref: '#/components/schemas/ParkingRecommendationItem'
        excluded:
          type: array
          description: 被排除的停车场及原因。
          items:
            $ref: '#/components/schemas/ParkingExcludedLot'
        offsets:
          type: array
          description: 偏移或时间调整建议，原样透传，元素结构以上游运行时为准。
    ParkingForecast:
      type: object
      additionalProperties: false
      required:
        - lot_id
        - issued_at
        - target_ts
        - horizon_minutes
        - point_free
        - p10
        - p90
        - free_rate
        - method
        - degraded
        - degrade_reason
        - model_version
        - data_asof
        - source
      description: |
        单个车场在某一预测时长上的余位预测。
        method 为 unavailable 时，point_free、p10、p90、free_rate、model_version、data_asof
        全部为 null（不是 0），degrade_reason 给出原因，例如 missing_observation、stale_observation 或 no_history。
      properties:
        lot_id:
          type: string
          description: 车场目录代码。
          example: P1
        issued_at:
          type: string
          format: date-time
          description: 预测的签发时间（UTC）。
        target_ts:
          type: string
          format: date-time
          description: 预测目标时刻（UTC）。
        horizon_minutes:
          type: integer
          enum: [15, 30, 45, 60]
          description: 预测时长（分钟）。
        point_free:
          type: integer
          nullable: true
          description: 目标时刻的预计空闲车位数，method=unavailable 时为 null。
          example: 41
        p10:
          type: integer
          nullable: true
          description: 空闲车位数预测下限（P10），method=unavailable 时为 null。
          example: 30
        p90:
          type: integer
          nullable: true
          description: 空闲车位数预测上限（P90），method=unavailable 时为 null。
          example: 52
        free_rate:
          type: number
          nullable: true
          description: 预计空闲车位占比（0–1），method=unavailable 时为 null。
          example: 0.34
        method:
          type: string
          enum: [model, last_known, same_slot_baseline, same_weekday_baseline, unavailable]
          description: |
            预测来源方法。unavailable 表示该时段不可预测，此时上述数值字段全部为 null。
        degraded:
          type: boolean
          description: 该条预测是否来自降级路径。
        degrade_reason:
          type: string
          nullable: true
          description: 降级原因，未降级时为 null。
        model_version:
          type: string
          nullable: true
          description: 生成预测的模型版本，method=unavailable 时为 null。
          example: 2.0.0
        data_asof:
          type: string
          format: date-time
          nullable: true
          description: 预测所依据数据的最新时刻（UTC），method=unavailable 时为 null。
        source:
          type: string
          enum: [synthetic]
          description: 数据来源，固定为合成示范数据。
    ParkingForecastResponse:
      type: object
      additionalProperties: false
      required: [lot_id, issued_at, source, available, degraded, note, forecasts]
      description: 单场预测响应。
      properties:
        lot_id:
          type: string
          description: 请求中的车场目录代码。
          example: P1
        issued_at:
          type: string
          format: date-time
          description: 请求中的签发时间，回显为 UTC。
        source:
          type: string
          enum: [synthetic]
          description: 数据来源，固定为合成示范数据。
        available:
          type: boolean
          description: 预测数据是否可用。
        degraded:
          type: boolean
          description: 是否处于降级状态。
        note:
          type: string
          nullable: true
          description: 降级或不可用的原因，正常时为 null。
        forecasts:
          type: array
          description: 按 horizons 顺序返回的预测列表。
          items:
            $ref: '#/components/schemas/ParkingForecast'
