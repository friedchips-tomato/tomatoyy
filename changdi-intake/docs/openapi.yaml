openapi: 3.0.3
info:
  title: 长堤风貌街接诉即办合作方接单接口
  version: 1.3.0
  description: |
    合作方通过服务端提交游客和居民的申报及照片，并向原提交人展示回执。
    POST /api/v1/integrations/intake/cases 是唯一合作方接口。办件查询、补材料、评价和补办由小程序办理。
    POST /api/v1/public/cases 是小程序游客诉求页使用的第一方公开接口，不要求接入凭据，
    去重键由小程序生成。两者的请求和响应契约各自独立。
    POST /api/v1/metrics/tourism/events 是导览来源上报行为事件的接口。每条来源使用自己的
    Bearer 凭据，来源身份和证据类别由服务端配置决定，请求不能选择来源。
    本文的地址、工单信息和回执值均为测试占位数据。正式接入基址和凭据由项目方另行交付。
servers:
  - url: https://intake-api.example-integration.test
    description: HTTPS 联调基址示例（保留测试域名）
  - url: http://127.0.0.1:3400
    description: 本地开发，仅使用本地测试配置
paths:
  /api/v1/integrations/intake/cases:
    post:
      operationId: submitIntakeCase
      summary: 提交申报及照片，或重取同一申报的回执
      description: |
        使用完整路径，省略查询参数和末尾斜杠。对该路径使用其他方法时返回
        405、Allow 响应头（值为 POST）及 {"error":"method_not_allowed"}。

        去重键为接入凭据对应的接入方身份与 externalCaseId。比较时对文本去首尾空白，
        将 occurredAt 转为 UTC，按文件声明类型与实际内容摘要比较照片。照片顺序及文件名
        不影响比较，重复照片仍参与数量和内容比较。可选字段省略时不计入内容。

        首次保存工单及全部照片后返回 201；同一去重键及相同规范化内容返回 200 和原回执；
        同一去重键及不同的合法内容返回 409，原单保持不变。不同接入方可以独立使用同一外部单号。
        默认只返回三个必返标识。项目方启用微信小程序码时，201 和 200 均含 wechatCode，
        同一工单在同一小程序账号及版本环境下复用已生成的图片。
        超时、连接中断或服务端暂时失败后，使用原外部单号和相同内容重试；
        收到 503 时遵循 Retry-After。发生冲突时核对原单，避免更换单号重复提交同一事项。
        wechat_code_unavailable 表示工单与附件已保存，小程序码暂不可用。原样重试成功时返回 200，
        以相同三个标识继续交付回执。

        平台收到 201 或 200 后才展示提交成功。privateLookupToken 仅在原提交人的
        成功会话中私下展示并提醒妥善保存。禁止写入 URL、二维码、日志、埋点、运营对账或平台长期后台记录。
        对账可使用合作方单号和工单编号。接入 Bearer 凭据由合作方服务端保管，不进入客户端。
      security:
        - IntegrationBearer: []
      requestBody:
        required: true
        description: |
          一个 multipart 请求。整个请求体上限为 15,794,176 字节
          （3 × 5 MiB + 64 KiB，含所有分隔线和各 part 头部）。
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload:
                  type: string
                  description: |
                    恰好一个名为 payload 的普通文本 part，内容为序列化的 UTF-8 JSON 对象。
                    不带 filename。解码后的文本按 UTF-8 计最多 32,768 字节。
                    工具先按本层 schema 处理文本 part，再解析 JSON 并按 x-json-schema 引用的字段定义校验。
                  x-json-schema:
                    $ref: '#/components/schemas/IntakePayload'
                  example: '{"externalCaseId":"EXT-SAMPLE-000137","occurredAt":"2026-11-17T09:42:00+08:00","location":"测试点位 A","category":"ROAD_SURFACE","description":"测试样例：人行道砖块松动。"}'
                photos:
                  type: array
                  minItems: 0
                  maxItems: 3
                  description: |
                    可省略。每张照片使用一个独立文件 part（携带 filename），字段名均为 photos。
                    单张上限 5,242,880 字节（5 MiB），照片合计最多 15,728,640 字节（15 MiB）。
                    各 part 声明 image/jpeg、image/png 或 image/webp，字节内容须通过对应的文件签名校验。
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: text/plain; charset=UTF-8
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 首次提交，工单及照片已保存。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: 同一接入方和外部单号以相同内容重试，返回原工单的同一回执。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: |
            请求体不完整且仍能返回应用响应（incomplete_body）；multipart 无法解析（invalid_multipart）；
            payload 缺失、重复或有未知 part 名（invalid_multipart_fields）；
            payload 是文件 part 或文本超限（invalid_payload_part）；
            JSON 语法错误（invalid_json）或顶层不是对象（invalid_json_object）；
            对象含未知字段（unknown_field）；字段缺失（包括 occurredAt）、类型、长度或文本内容无效（invalid_field）；
            非空且通过通用文本校验的 occurredAt 不符合日期时间规则（invalid_timestamp）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum:
                          - incomplete_body
                          - invalid_multipart
                          - invalid_multipart_fields
                          - invalid_payload_part
                          - invalid_json
                          - invalid_json_object
                          - unknown_field
                          - invalid_field
                          - invalid_timestamp
        '401':
          description: Authorization 缺失、格式错误或 Bearer 凭据未知（包括撤换后已失效的凭据）。
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [unauthorized]
        '403':
          description: Bearer 凭据有效，但属于工作人员身份。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [forbidden]
        '408':
          description: |
            应用等待请求体超过约 15 秒（body_timeout）。若连接已中断或由 HTTP 层先超时，可能收不到 JSON。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [body_timeout]
        '409':
          description: 同一接入方复用外部单号提交不同内容，原单和原附件保持不变。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [submission_conflict]
              example:
                error: submission_conflict
        '413':
          description: 照片张数超限（too_many_photos）、单张超限（photo_too_large）或请求体总长度超限（body_too_large）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_photos, photo_too_large, body_too_large]
        '415':
          description: |
            请求 Content-Type 未声明 multipart/form-data 及参数分隔符（expected_multipart）；
            photos part 缺少文件形式、类型不在允许列表或内容签名与声明类型不匹配（invalid_photo_type）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [expected_multipart, invalid_photo_type]
        '500':
          description: 应用内部错误。可按原单号和相同内容重试。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [internal_error]
        '503':
          description: |
            服务当前已有 4 个上传请求在途（intake_busy），或数据库繁忙／锁定（database_busy）。
            已启用的小程序码暂不可用或生成队列已满（wechat_code_unavailable）时，
            工单和申报附件已保存，仍可用同一外部单号及相同内容重试。
          headers:
            Retry-After:
              description: 等待秒数。
              schema:
                type: integer
                enum: [1]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [intake_busy, database_busy, wechat_code_unavailable]
  /api/v1/public/cases:
    post:
      operationId: submitPublicCase
      summary: 游客公开申报，或重取同一申报的回执
      description: |
        小程序游客诉求页直接调用，不要求 Authorization。请求携带 Authorization 时按匿名申报处理，
        不校验接入凭据。对该路径使用其他方法时返回 405、Allow 响应头（值为 POST）
        及 {"error":"method_not_allowed"}。

        去重键固定为 clientRequestId，由小程序生成并在重试时复用。比较时对文本去首尾空白，
        将 occurredAt 转为 UTC，按文件声明类型与实际内容摘要比较照片。照片顺序及文件名
        不影响比较，重复照片仍参与数量和内容比较。可选字段省略时不计入内容。

        首次保存工单及全部照片后返回 201；同一 clientRequestId 及相同规范化内容返回 200 和原回执；
        同一 clientRequestId 及不同的合法内容返回 409，原单保持不变。项目方启用微信小程序码时，
        201 和 200 均含 wechatCode，同一工单在同一小程序账号及版本环境下复用已生成的图片。
        微信小程序码暂不可用或生成队列已满时，工单和申报附件照常保存，201 和 200 仍返回上述三个标识字段
        并省略 wechatCode：游客据此拿到公开查询码与私密凭证，微信上游恢复后用同一 clientRequestId
        及相同内容重试即取到含 wechatCode 的回执。

        按对端地址做窗口限流，默认每 600 秒只统计 10 次新建建单。只有新建建单受上限约束：
        已成功单号的重放（内容一致返回 200，内容不同返回 409）不消耗额度，也不受当前窗口上限影响，
        原提交人始终能取回自己的回执。超限的新建请求返回 429 too_many_requests 并带 Retry-After（秒），
        被限流的请求不落库。
        超时、连接中断或服务端暂时失败后，使用原 clientRequestId 和相同内容重试。

        平台收到 201 或 200 后才展示提交成功。privateLookupToken 仅在原提交人的
        成功会话中私下展示并提醒妥善保存。禁止写入 URL、二维码、日志、埋点、运营对账或平台长期后台记录。
      security: []
      requestBody:
        required: true
        description: |
          一个 multipart 请求。整个请求体上限为 15,794,176 字节
          （3 × 5 MiB + 64 KiB，含所有分隔线和各 part 头部）。
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload:
                  type: string
                  description: |
                    恰好一个名为 payload 的普通文本 part，内容为序列化的 UTF-8 JSON 对象。
                    不带 filename。解码后的文本按 UTF-8 计最多 32,768 字节。
                    工具先按本层 schema 处理文本 part，再解析 JSON 并按 x-json-schema 引用的字段定义校验。
                  x-json-schema:
                    $ref: '#/components/schemas/PublicSubmissionPayload'
                  example: '{"clientRequestId":"mp-20261119-000137","occurredAt":"2026-11-17T09:42:00+08:00","location":"测试点位 A","category":"ROAD_SURFACE","description":"测试样例：人行道砖块松动。"}'
                photos:
                  type: array
                  minItems: 0
                  maxItems: 3
                  description: |
                    可省略。每张照片使用一个独立文件 part（携带 filename），字段名均为 photos。
                    单张上限 5,242,880 字节（5 MiB），照片合计最多 15,728,640 字节（15 MiB）。
                    各 part 声明 image/jpeg、image/png 或 image/webp，字节内容须通过对应的文件签名校验。
                  items:
                    type: string
                    format: binary
            encoding:
              payload:
                contentType: text/plain; charset=UTF-8
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 首次申报，工单及照片已保存。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: 同一 clientRequestId 以相同内容重试，返回原工单的同一回执。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: |
            请求体不完整且仍能返回应用响应（incomplete_body）；multipart 无法解析（invalid_multipart）；
            payload 缺失、重复或有未知 part 名（invalid_multipart_fields）；
            payload 是文件 part 或文本超限（invalid_payload_part）；
            JSON 语法错误（invalid_json）或顶层不是对象（invalid_json_object）；
            对象含未知字段（unknown_field）；字段缺失（包括 clientRequestId 和 occurredAt）、
            类型、长度或文本内容无效（invalid_field）；
            非空且通过通用文本校验的 occurredAt 不符合日期时间规则（invalid_timestamp）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum:
                          - incomplete_body
                          - invalid_multipart
                          - invalid_multipart_fields
                          - invalid_payload_part
                          - invalid_json
                          - invalid_json_object
                          - unknown_field
                          - invalid_field
                          - invalid_timestamp
        '409':
          description: 同一 clientRequestId 提交不同内容，原单和原附件保持不变。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [submission_conflict]
              example:
                error: submission_conflict
        '413':
          description: 照片张数超限（too_many_photos）、单张超限（photo_too_large）或请求体总长度超限（body_too_large）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_photos, photo_too_large, body_too_large]
        '415':
          description: |
            请求 Content-Type 未声明 multipart/form-data 及参数分隔符（expected_multipart）；
            photos part 缺少文件形式、类型不在允许列表或内容签名与声明类型不匹配（invalid_photo_type）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [expected_multipart, invalid_photo_type]
        '429':
          description: 同一对端地址在限流窗口内的新建建单次数超限，本次请求未落库。
          headers:
            Retry-After:
              description: 距离当前限流窗口结束还需等待的秒数。
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [too_many_requests]
        '500':
          description: 应用内部错误。可按原 clientRequestId 和相同内容重试。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [internal_error]
        '503':
          description: |
            服务当前已有 4 个上传请求在途（intake_busy），或数据库繁忙／锁定（database_busy）。
            这两种情况下本次请求未落库，仍可用同一 clientRequestId 及相同内容重试。
            微信小程序码暂不可用（wechat_code_unavailable）不在此返回：工单和申报附件已保存时，
            仍返回 201 或 200 与 caseNumber、publicLookupCode、privateLookupToken 三个标识，只是省略 wechatCode。
          headers:
            Retry-After:
              description: 等待秒数。
              schema:
                type: integer
                enum: [1]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [intake_busy, database_busy]
  /api/v1/metrics/tourism/events:
    post:
      operationId: submitTourismEvent
      summary: 上报一条导览行为事件
      description: |
        导览来源（演示 H5、运营 H5、真实预约服务、车场核验）通过服务端上报行为事件。
        每条来源持有独立的服务端凭据和受限事件目录，凭据不进入 SQLite、浏览器或日志。
        接入凭据、接单凭据、商户会话和管理会话都不能写入本接口；未配置导览来源时同样不能写入。
        来源身份和证据类别由服务端配置决定，请求不能选择来源、证据或目录代码。

        使用完整路径，省略查询参数和末尾斜杠。对该路径使用其他方法时返回 405、
        Allow 响应头（值为 POST）及 {"error":"method_not_allowed"}。

        请求体是单个 JSON 对象，上限 512 字节。字段固定为 eventId、type、subjectId、flowId、
        occurredAt，仅 guide_played 另带必填的 durationSeconds。服务端拒绝多余字段、重复键
        （含转义后同名的键）和无效 UTF-8。

        首次记录返回 201 且响应体为空；同一来源内相同 eventId 且规范化内容相同返回 200 且响应体为空；
        同一 eventId 内容不同返回 409。新的 eventId 命中相同来源、类型、对象和流程时沿用首次记录并返回 200。
        事件类型是否属于该来源，由服务端配置和来源证据类别决定。

        occurredAt 允许最多领先服务端时间五分钟。覆盖范围和统计口径由服务端配置，
        客户端不能指定统计截点。
      security:
        - TourismSourceBearer: []
      requestBody:
        required: true
        description: |
          一个 JSON 对象。Content-Type 须为 application/json，可带 charset=utf-8。
          正文上限 512 字节。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourismEvent'
      responses:
        '201':
          description: 事件已记录。
          headers:
            NoStore:
              $ref: '#/components/headers/NoStore'
        '200':
          description: 同一事件的重放，或同一流程的重复上报。
          headers:
            NoStore:
              $ref: '#/components/headers/NoStore'
        '400':
          description: |
            正文不是合法 JSON、不是合法 UTF-8、含重复键、字段不符、对象代码不在来源目录内、
            时间无效或早于允许的领先范围（future_tourism_event），或正文超过 512 字节（body_too_large）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [invalid_json, invalid_utf8, duplicate_field, invalid_tourism_fields,
                          invalid_tourism_id, invalid_tourism_type, invalid_tourism_subject,
                          invalid_tourism_duration, invalid_timestamp, future_tourism_event, body_too_large]
        '401':
          description: 缺少凭据或凭据无效。
          headers:
            WWW-Authenticate:
              description: 固定为 Bearer。
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [unauthorized]
        '403':
          description: |
            凭据不属于导览来源（forbidden），来源未配置（tourism_source_forbidden），
            或该来源无权上报此事件类型（tourism_type_forbidden）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [forbidden, tourism_source_forbidden, tourism_type_forbidden]
        '404':
          description: 路径不存在。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [route_not_found]
        '405':
          description: 方法不允许。
          headers:
            Allow:
              description: 固定为 POST。
              schema:
                type: string
                enum: [POST]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [method_not_allowed]
        '409':
          description: 同一 eventId 已记录了不同的内容。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [tourism_event_conflict]
        '413':
          description: 正文超过 512 字节。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [body_too_large]
        '415':
          description: Content-Type 不是 application/json。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      error:
                        enum: [expected_json]
components:
  securitySchemes:
    IntegrationBearer:
      type: http
      scheme: bearer
      description: |
        Authorization 头使用 Bearer <ACCESS_TOKEN>。接入令牌为 32–256 位，
        字符限 A–Z、a–z、0–9、下划线和连字符。由项目方签发、轮换或撤换。
    TourismSourceBearer:
      type: http
      scheme: bearer
      description: |
        Authorization 头使用 Bearer <SOURCE_TOKEN>。导览来源令牌为 32–256 位，
        字符限 A–Z、a–z、0–9、下划线和连字符。每条来源单独签发，与接单令牌、
        商户会话和管理会话互不通用；相同令牌出现在两处时服务端启动失败。
  headers:
    NoStore:
      description: 回执含私密凭证，请勿缓存。
      schema:
        type: string
        enum: [no-store]
  schemas:
    IntakePayload:
      type: object
      additionalProperties: false
      required: [externalCaseId, occurredAt, location, category, description]
      description: |
        本 schema 校验从 payload 文本 part 解析出的 JSON 对象。
        所有字段均须为有效 Unicode 字符串，不允许 NUL。服务端在裁剪空白前按
        Unicode 码点计算长度上限，并拒绝裁剪后为空的字符串。
        可选字段可省略；出现时也必须满足相同文本规则。
      properties:
        externalCaseId:
          type: string
          minLength: 1
          maxLength: 128
          description: 合作方的稳定申报单号，由合作方生成。
        occurredAt:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\s*[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\s*$'
          description: |
            发生时间，使用 YYYY-MM-DDTHH:mm:ss、可选 1–3 位秒小数，并带 Z 或 ±HH:MM。
            服务端校验实际日期及时刻，归一化为 UTC，UTC 年须在 0001–9999。
          example: '2026-11-17T09:42:00+08:00'
        location:
          type: string
          minLength: 1
          maxLength: 300
          description: 发生地点，支持手填文本。
        category:
          type: string
          minLength: 1
          maxLength: 80
          description: 问题类别。当前接受自由文本，分类枚举待联调确认。
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: 申报描述。
        suggestedDepartment:
          type: string
          minLength: 1
          maxLength: 100
          description: 可选的建议承办部门。
        contact:
          type: string
          minLength: 1
          maxLength: 300
          description: 可选的联系方式文本。匿名申报可省略。
          example: synthetic-contact-0001
    PublicSubmissionPayload:
      type: object
      additionalProperties: false
      required: [clientRequestId, occurredAt, location, category, description]
      description: |
        本 schema 校验从 payload 文本 part 解析出的 JSON 对象。
        所有字段均须为有效 Unicode 字符串，不允许 NUL。服务端在裁剪空白前按
        Unicode 码点计算长度上限，并拒绝裁剪后为空的字符串。
        可选字段可省略；出现时也必须满足相同文本规则，没有值时省略而不是传空字符串。
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            小程序生成的去重键。同一 app 会话内不同申报使用不同取值，重试时复用原值。
        occurredAt:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\s*[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\s*$'
          description: |
            发生时间，使用 YYYY-MM-DDTHH:mm:ss、可选 1–3 位秒小数，并带 Z 或 ±HH:MM。
            服务端校验实际日期及时刻，归一化为 UTC，UTC 年须在 0001–9999。
          example: '2026-11-17T09:42:00+08:00'
        location:
          type: string
          minLength: 1
          maxLength: 300
          description: 发生地点，支持手填文本。
        category:
          type: string
          minLength: 1
          maxLength: 80
          description: 问题类别。当前接受自由文本，分类枚举待联调确认。
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: 申报描述。
        suggestedDepartment:
          type: string
          minLength: 1
          maxLength: 100
          description: 可选的建议承办部门。
        contact:
          type: string
          minLength: 1
          maxLength: 300
          description: |
            可选的联系方式文本，单独存储且不进入公开查询。匿名申报可省略。
          example: synthetic-contact-0001
    Receipt:
      type: object
      additionalProperties: false
      required: [caseNumber, publicLookupCode, privateLookupToken]
      properties:
        caseNumber:
          type: string
          pattern: '^CD-[0-9A-F]{32}$'
          description: 项目方生成的工单编号。
        publicLookupCode:
          type: string
          pattern: '^[A-Za-z0-9_-]{24}$'
          description: |
            公开查询码用于定位工单，也是启用微信小程序码时的场景值。
            公开页仅展示编号、状态和允许公开的时间节点。
        privateLookupToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            仅交原提交人的私密查询凭证，与公开查询码分开。禁止写入二维码、URL、日志或运营对账记录。
        wechatCode:
          $ref: '#/components/schemas/WechatCode'
      example:
        caseNumber: CD-00000000000040008000000000000001
        publicLookupCode: test_lookup_placeholder0
        privateLookupToken: test_private_lookup_placeholder_0000000000A
    WechatCode:
      type: object
      additionalProperties: false
      required: [envVersion, mediaType, base64]
      description: |
        仅在项目方启用微信小程序码时提供。扫码进入 pages/public/index，
        场景值只有 publicLookupCode。可按 mediaType 还原并在成功回执会话中展示。
      properties:
        envVersion:
          type: string
          enum: [release, trial, develop]
          description: 小程序正式版、体验版或开发版。
        mediaType:
          type: string
          enum: [image/jpeg, image/png]
        base64:
          type: string
          format: byte
          minLength: 4
          maxLength: 1398104
          description: 标准 Base64 图片字节，没有 data URL 前缀。解码后最多 1 MiB。
    TourismEvent:
      type: object
      additionalProperties: false
      required: [eventId, type, subjectId, flowId, occurredAt]
      description: |
        一个导览行为事件。字段固定，多余字段一律拒绝。
        该标识与预约原号、账号、联系方式、坐标、工单号、回执和原始文本无关。
      properties:
        eventId:
          type: string
          pattern: '^[0-9a-f]{24}$'
          description: |
            事件标识，24 位小写十六进制。每次上报生成一个，重试时复用同一个。
        type:
          type: string
          enum: [route_exposed, route_adopted, route_completed_self_reported, guide_played,
            booking_demo_submitted, parking_advice_adopted, parking_navigation_clicked,
            booking_requested, booking_confirmed, booking_cancelled, parking_arrival_verified]
          description: |
            事件类型。可上报的类型由来源配置和证据类别决定：
            演示 H5 可报路线曝光、采纳、游客自报完成、语音实播、预约演示提交、停车建议采纳和停车导航点击；
            运营 H5 可报前六项中的可核实部分；
            真实预约服务可报预约发起、确认和取消；
            车场核验可报停车核验到达。
        subjectId:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(-[A-Z0-9]+)*$'
          maxLength: 32
          description: |
            目录代码，必须在该来源配置的事件目录内。路线用 R1 至 R3，
            讲解点位用 CD- 开头的点位代码，讲解员用 G1 至 G3，车场用 P1、P2。
        flowId:
          type: string
          pattern: '^[0-9a-f]{24}$'
          description: |
            流程标识，24 位小写十六进制。同一次推荐或一次预约生命周期复用同一个流程标识，
            每个状态各自使用独立的事件标识。
        occurredAt:
          type: string
          maxLength: 40
          pattern: '^\s*[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])\s*$'
          description: |
            发生时间，使用 YYYY-MM-DDTHH:mm:ss、可选 1–3 位秒小数，并带 Z 或 ±HH:MM。
            设备时钟允许最多领先服务端五分钟。
          example: '2026-11-22T09:42:00+08:00'
        durationSeconds:
          type: integer
          minimum: 1
          description: 仅 guide_played 必填，为实际播放秒数，暂停和准备时间不计入。
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          pattern: '^[a-z]+(_[a-z]+)*$'
          description: 应用返回的机器可读错误码。
